<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abstergo Market Signal Monitor</title>
<style>
:root{--bg:#09080f;--panel:#15131e;--panel2:#1c1928;--border:#302a43;--text:#f7f5ff;--muted:#aaa4bb;--purple:#855bfb;--green:#35d49a;--red:#ff667a;--amber:#ffbf47}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#261a49 0,#09080f 38%);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:34px 24px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:28px}h1{font-size:34px;margin:0}.sub,.pair,.footer{color:var(--muted)}.sub{margin-top:7px}.status{font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.asset{min-width:0;background:linear-gradient(145deg,var(--panel),#100e18);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 18px 60px #0005}.asset-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.coin{display:flex;align-items:center;gap:12px}.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:21px;background:var(--purple)}.eth .icon{background:#627eea}.symbol{font-size:22px;font-weight:800}.price{font-size:24px;font-weight:800;text-align:right}.chart-wrap{height:150px}.chart-wrap canvas{display:block;width:100%;height:150px}.legend{display:flex;gap:16px;margin:6px 0 14px;font-size:10px;font-weight:800;letter-spacing:.35px}.legend span:before{content:'';display:inline-block;width:14px;border-top:2px dashed currentColor;margin-right:6px}.r4{color:var(--amber)}.r1{color:var(--red)}.timeframes{display:grid;gap:12px}.tf{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px}.tf-top,.rsi{display:flex;justify-content:space-between}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:7px;background:#77728b22}.rsi{background:#0e0c15;border-radius:9px;padding:10px 11px;margin:10px 0 6px}.metrics{display:grid;grid-template-columns:90px 1fr 94px}.metrics>div{padding:7px 0;border-top:1px solid #ffffff0b}.label{font-size:12px;color:var(--muted)}.value{font:12px ui-monospace,monospace}.above{color:var(--green);text-align:right}.below{color:var(--red);text-align:right}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:12px}.error{color:var(--red)}@media(max-width:820px){body{overflow-x:hidden}.wrap{padding:24px 14px}header{align-items:start;flex-direction:column}h1{font-size:28px}.grid{grid-template-columns:1fr}.asset{padding:16px}.metrics{grid-template-columns:64px minmax(68px,1fr) 82px}.value{font-size:10px}.footer{flex-direction:column}}
</style></head><body><main class="wrap"><header><div><h1>Market Signal Monitor</h1><div class="sub">Closed-candle structure for BTCUSDT and ETHUSDT</div></div><div class="status"><span class="dot"></span><span id="status">Loading public market data…</span></div></header><section class="grid" id="cards"></section><div class="footer"><span>Public Binance market data · Monitoring only · No trading access</span><span id="updated"></span></div></main>
<script>
const API='https://data-api.binance.vision/api/v3/klines',symbols=['BTCUSDT','ETHUSDT'];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n<100?2:0}).format(n), pct=n=>`${Math.abs(n).toFixed(2)}% ${n>=0?'above':'below'}`;
async function candles(symbol,interval,limit){let r=await fetch(`${API}?symbol=${symbol}&interval=${interval}&limit=${limit}`,{cache:'no-store'});if(!r.ok)throw Error(`Binance HTTP ${r.status}`);let now=Date.now(),rows=await r.json();return rows.filter(x=>+x[6]<now).map(x=>({time:+x[6],high:+x[2],close:+x[4]}))}
function ema(xs,p){let v=xs.slice(0,p).reduce((a,b)=>a+b,0)/p,k=2/(p+1);for(let x of xs.slice(p))v=x*k+v*(1-k);return v}function rsi(xs,p=14){let gains=0,losses=0;for(let i=1;i<=p;i++){let d=xs[i]-xs[i-1];gains+=Math.max(d,0);losses+=Math.max(-d,0)}let ag=gains/p,al=losses/p;for(let i=p+1;i<xs.length;i++){let d=xs[i]-xs[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p}return al===0?100:100-100/(1+ag/al)}
function tfCard(interval,c){let xs=c.map(x=>x.close),price=xs.at(-1),rv=rsi(xs),zone=rv>=70?'OVERBOUGHT':rv<=30?'OVERSOLD':'NEUTRAL',rows=[100,150,200].map(p=>{let e=ema(xs,p),d=(price-e)/e*100;return `<div class="label">EMA ${p}</div><div class="value">${money(e)}</div><div class="${d>=0?'above':'below'}">${pct(d)}</div>`}).join('');return `<div class="tf"><div class="tf-top"><b>${interval==='5m'?'5 MINUTE':'1 HOUR'}</b><span class="badge">${zone}</span></div><div class="rsi"><span>RSI · 14</span><b>${rv.toFixed(1)}</b></div><div class="metrics">${rows}</div></div>`}
function draw(symbol,chart){let el=document.getElementById('chart-'+symbol),ctx=el.getContext('2d'),w=el.clientWidth,h=150,d=devicePixelRatio||1;el.width=w*d;el.height=h*d;ctx.scale(d,d);let vals=chart.points.map(p=>p.close).concat([chart.r4,chart.r1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.08,1),y=v=>h-(v-(lo-pad))/(hi-lo+2*pad)*h,x=i=>i*w/(chart.points.length-1);ctx.strokeStyle='#855bfb';ctx.lineWidth=2;ctx.beginPath();chart.points.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.close)):ctx.moveTo(x(i),y(p.close)));ctx.stroke();[['r4','#ffbf47'],['r1','#ff667a']].forEach(([key,color])=>{ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,y(chart[key]));ctx.lineTo(w,y(chart[key]));ctx.stroke();ctx.setLineDash([])})}
async function asset(symbol){let [m5,h1,h4,d1]=await Promise.all([candles(symbol,'5m',250),candles(symbol,'1h',250),candles(symbol,'4h',21),candles(symbol,'1d',21)]),chart={points:m5.slice(-96),r4:Math.max(...h4.slice(-20).map(x=>x.high)),r1:Math.max(...d1.slice(-20).map(x=>x.high))},price=m5.at(-1).close;return {symbol,m5,h1,chart,price}}
function render(a){return `<article class="asset ${a.symbol.startsWith('ETH')?'eth':''}"><div class="asset-head"><div class="coin"><div class="icon">${a.symbol.startsWith('BTC')?'₿':'Ξ'}</div><div><div class="symbol">${a.symbol.slice(0,3)}</div><div class="pair">${a.symbol}</div></div></div><div class="price">${money(a.price)}</div></div><div class="chart-wrap"><canvas id="chart-${a.symbol}" aria-label="${a.symbol} price chart with resistance lines"></canvas></div><div class="legend"><span class="r4">4 HOUR RESISTANCE</span><span class="r1">DAILY RESISTANCE</span></div><div class="timeframes">${tfCard('5m',a.m5)}${tfCard('1h',a.h1)}</div></article>`}
async function load(){try{let assets=await Promise.all(symbols.map(asset));cards.innerHTML=assets.map(render).join('');assets.forEach(a=>draw(a.symbol,a.chart));status.textContent='Live · refreshes every 60 seconds';updated.textContent='Updated '+new Date().toLocaleTimeString()}catch(e){status.textContent='Data unavailable';cards.innerHTML=`<div class="asset error">${e.message}</div>`}}load();setInterval(load,60000);
</script></body></html>
